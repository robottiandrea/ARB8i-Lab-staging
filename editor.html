<script>
  (function () {
    const isStandalone =
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      (navigator.standalone === true); // iOS legacy

    if (!isStandalone) return;

    // TUTTI i link interni restano nella PWA (niente Safari esterno)
    addEventListener('click', function (e) {
      const a = e.target.closest('a[href]');
      if (!a || a.dataset.external === '1') return;

      const url = new URL(a.getAttribute('href'), location.href);
      if (url.origin !== location.origin) return; // esterno: lascio stare

      e.preventDefault();
      // usa percorso relativo per evitare edge-case su iOS
      location.assign(url.pathname + url.search + url.hash);
    }, { capture: true });
  })();
</script>

// --- Rilevamento: telefono touch "stretto", escludendo iPad ---
function isIPadLike(){
  const ua = navigator.userAgent || '';
  const isiPadUA = /iPad/i.test(ua);
  const macTouch = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  return isiPadUA || macTouch; // iPadOS spesso appare come Mac + touch
}

// Schermo "stretto" = telefono (usiamo dimensione fisica dello schermo)
function isNarrowScreen(){
  const sw = Math.min(window.screen.width, window.screen.height);
  return sw <= 820; // iPad esce da questa soglia
}

function isNarrowTouchPhone(){
  const coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  return coarse && isNarrowScreen() && !isIPadLike();
}

// Stato corrente (ricalcolabile a rotazione/orientamento)

function applyMobileNaturalMode(){
  // Disattiva forzature: lascia fluido, con scroll naturale
  document.documentElement.style.setProperty('--frame-max-h', 'none');
  const frame = document.querySelector('.frame');
  if (frame){

}

function applyDesktopManagedMode(){
  const frame = document.querySelector('.frame');
  if (frame){
    frame.style.transition = 'width .12s ease';
  }
  // Ricalcola normalmente (usa la tua funzione)
  updateFrameMaxHeight();
}

// Debounce utilità
const debouncedReeval = (() => {
  let to;
  return () => { clearTimeout(to); to = setTimeout(reevaluateMode, 80); };
})();

function reevaluateMode(){
  const prev = IS_NARROW_TOUCH_PHONE;
  IS_NARROW_TOUCH_PHONE = isNarrowTouchPhone();
  if (IS_NARROW_TOUCH_PHONE !== prev){
    if (IS_NARROW_TOUCH_PHONE) applyMobileNaturalMode();
    else applyDesktopManagedMode();
  }else{
    if (!IS_NARROW_TOUCH_PHONE) updateFrameMaxHeight();
  }
}

async function svgToBitmap(path, W, H){
  const r = await fetch(`./overlays/${path}`);
  if (!r.ok) return null;
  const svg = await r.text();
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url  = URL.createObjectURL(blob);
  const img  = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  c.getContext('2d').drawImage(img,0,0,W,H);
  URL.revokeObjectURL(url);
  return await createImageBitmap(c);
}

function setStatus(t){ statusEl.textContent = t || ''; }
function pad32hex(n){ const h = BigInt(n).toString(16); return h.padStart(64,'0'); }
function decodeAbiString(hexdata){
  if(!hexdata || !hexdata.startsWith('0x')) return null;
  const h = hexdata.slice(2); if(h.length<128) return null;
  const length = parseInt(h.slice(64,128),16);
  const s = h.slice(128, 128 + length*2);
  try{ const bytes = s.match(/.{1,2}/g).map(b=>parseInt(b,16)); return new TextDecoder().decode(new Uint8Array(bytes)); }catch{ return null; }
}
async function rpcCall(method, params){
  const payload={jsonrpc:'2.0',id:1,method,params}, headers={'Content-Type':'application/json','Accept':'application/json'};
  for(const url of RPCS){ try{ const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(payload)}); if(!r.ok) continue; const d=await r.json(); if(d && !d.error) return d.result; }catch{} }
  return null;
}
function ipfsUrls(uri){ if(typeof uri!=='string') return []; if(uri.startsWith('ipfs://')){ const p=uri.replace('ipfs://',''); return IPFS_GW.map(g=>g+p); } return [uri]; }
async function fetchJsonAny(urls){ for(const u of urls){ try{ const r=await fetch(u,{headers:{'Accept':'application/json'}}); if(r.ok) return await r.json(); }catch{} } return null; }
async function fetchBlobAny(urls){ for(const u of urls){ try{ const r=await fetch(u); if(r.ok) return await r.blob(); }catch{} } return null; }

/* ===== Manifest & maps ===== */
async function loadManifest(){
  for(const url of ['./overlays/overlays.json','./overlays.json']){
    try{ const r=await fetch(url); if(r.ok){ OVERLAYS=await r.json(); return; } }catch{}
  }

}
function getCfg(id){ return OVERLAYS?.items?.find(o=>o.id===id) || null; }

function parseCsv(text){
  const map = {};
  text
    .replace(/\ufeff/g,'')            // BOM
    .replace(/\r\n?/g,'\n')
    .split('\n')
    .forEach(line=>{
      let s = line.trim();
      if(!s) return;
      // split su ; , o :
      const parts = s.split(/[,;:]\s*/);
      if(parts.length < 2) return;
      const name = (parts[0] || '').replace(/^"+|"+$/g,'').trim();
      let raw   = (parts.slice(1).join(':') || '').replace(/^"+|"+$/g,'').trim();
      if(!name || !raw) return;
      if (/^name$/i.test(name) && /^hex$/i.test(raw)) return; // header

      // normalizza valore: doppi #, spazi intorno a |
      raw = raw.replace(/##/g, '#').replace(/\s*\|\s*/g, '|');

      // Salviamo la stringa così com'è: "#RRGGBB" (flat) o "#...|#...|#..." (gradiente)
      map[name] = raw;
    });
  return map;
}

function cssEscapeCompat(str){
  return (window.CSS && CSS.escape) ? CSS.escape(str) : String(str).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
}

// Rende visibile SOLO il nodo con id targetId, nasconde gli omonimi con suffisso

// Se esiste il nodo con suffisso variante, usa quello, altrimenti il base
function resolveVariantId(svgRoot, baseId, variant){

    const vId = `${baseId}_${variant}`;
    if (svgRoot.querySelector('#' + cssEscapeCompat(vId))) return vId;
  }

}

// ===== BEGIN: LAYOUT HELPERS (add) =====
// SOSTITUISCI la vecchia pickLayoutId con questa
function pickLayoutId(cfg, row, prefix = 'layout') {
  // costruiamo una lista ordinata: default -> alt -> alt2 -> alt3 ...
  const idDefault   = cfg[`${prefix}DefaultId`] || null;

  const options = [];
  // default sempre per primo (senza "when")
  if (idDefault) options.push({ id: idDefault, when: null });

  // raccogli tutte le chiavi tipo `${prefix}AltId`, `${prefix}Alt2Id`, ...
  const entries = Object.keys(cfg)
    .filter(k => k.startsWith(`${prefix}Alt`) && k.endsWith('Id'))
    .map(k => {
      const base = k.slice(0, -2); // toglie "Id"
      const whenKey = `${base}When`;
      return { id: cfg[k], when: cfg[whenKey] };
    })
    // mantieni l'ordine Alt, Alt2, Alt3...
    .sort((a, b) => {
      const ai = (a.id && a.id.includes('Alt')) ? a.id : '';
      const bi = (b.id && b.id.includes('Alt')) ? b.id : '';
      return ai.localeCompare(bi, 'en', { numeric: true });
    })
    .filter(o => !!o.id);

  // unisci: default (se c'è) + alt/alt2/alt3...
  const all = options.concat(entries);

  // cerca la prima ALT con needles che matchano
  for (const opt of all) {
    if (!opt.when || !Array.isArray(opt.when) || opt.when.length === 0) continue;
    if (rowHasAnyNeedle(row, opt.when)) return opt.id;
  }
  // se nessuna ALT matcha, prendi il default (se esiste), altrimenti la prima che c’è
  return idDefault || (entries[0]?.id ?? null);
}

function showOnlyLayoutGroup(svgRoot, ids, chosenId){

  });
}


function pickMaskLayersForRow(row) {
  const del = [];
  const keep = [];

  // Helpers coerenti
  const isBody     = (v) => rowHasTrait(row, 'body', v);
  const isHair     = (v) => rowHasTrait(row, 'hair', v);
  const isHead     = (v) => rowHasTrait(row, 'head', v);
  const isFace     = (v) => rowHasTrait(row, 'face', v);
  const isPiercing = (v) => rowHasTrait(row, 'piercing', v);

  // === logica pre-esistente ===
  const isSkelly      = isBody('skelly');
  const isHoodieBody  = isBody('hoodie');
  const isCatBody     = isBody('cat');
  const isCoffeeHead = isHead('coffee');
  const isStrawFace  = isFace('straw');
  const isPoopieHair = isHair('poopie');
  const isHaloHair   = isHair('halo');
  const isBalloon    = isHead('balloon');
  

  if (isCatBody) del.push('cat_delete');

  if (isSkelly) del.push('skelly_delete');

  if (isCoffeeHead) {
    if (isHoodieBody) del.push('coffee_hoodie_delete');
    else              del.push('coffee_delete');
  }

  if (isStrawFace) keep.push('straw_preserve');

  // qui la logica richiesta
  if (isPoopieHair) {
    keep.push(isSkelly ? 'fly_skelly_preserve' : 'fly_preserve');
  }

  // HALO: se hair=halo e body=cat, preserva versione speciale; altrimenti logica standard
  if (isHaloHair) {
    if (isCatBody) {
      keep.push('halo_cat_preserve');  // ⬅️ nuovo caso speciale
    } else {
      keep.push('halo_preserve');
      del.push('halo_delete');
    }
  }

  if (isBalloon) del.push('balloon_delete');

  // === Piercing: hoop (tabella regole) ===
  if (isPiercing('hoop')) {
    // Predicati leggibili
    const isHoodie      = () => isBody('hoodie');
    const isPuffer      = () => isBody('puffer');

    const isMullet      = () => isHair('mullet');
    const isLong        = () => isHair('long');
    const isMessy       = () => isHair('messy');

    const isTurtleneck  = () => isBody('turtleneck');
    const isSatchel     = () => isBody('satchel');     // accorpato con turtleneck per hoop_tot_delete
    const isBlazer      = () => isBody('blazer');
    const isCollar      = () => isBody('collar');
    const isFleece      = () => isBody('fleece');
    const isChain       = () => isBody('chain');
    const isHoloSweater = () => isBody('holographic sweater');
    const isJacket      = () => isBody('jacket');

    // Regole in ordine di priorità (la prima che matcha vince)
    const rules = [
      { when: isHoodie,                         action: null }, // non bucare
      { when: isPuffer,                         action: null }, // non bucare
      { when: isMullet,                         action: null }, // non bucare
      { when: isLong,                           action: null }, // non bucare
      { when: isMessy,                          action: () => del.push('hoop_messy_delete') },
      { when: () => isTurtleneck() || isSatchel(), action: () => del.push('hoop_tot_delete') },
      { when: isBlazer,                         action: () => del.push('hoop_blazer_delete') },
      { when: isCollar,                         action: () => del.push('hoop_collar_delete') },
      { when: isFleece,                         action: () => del.push('hoop_fleece_delete') },
      { when: () => isChain() || isHoloSweater(), action: () => del.push('hoop_chain_delete') },
      { when: isJacket,                         action: () => del.push('hoop_jacket_delete') },
      // default: non bucare (nessuna regola matcha)
    ];

    for (const rule of rules) {
      if (rule.when()) {
        if (rule.action) rule.action(); // null = noop
        break;
      }
    }
  }

  return { deleteLayers: del, preserveLayers: keep };
}




async function buildErasePreserveBitmaps(W, H, row){
  const svg = await loadOverlayMaskSvg();

  // canvases
  const cDel   = document.createElement('canvas'); cDel.width=W;  cDel.height=H;
  const gDel   = cDel.getContext('2d'); gDel.clearRect(0,0,W,H);

  const cKeep  = document.createElement('canvas'); cKeep.width=W; cKeep.height=H;
  const gKeep  = cKeep.getContext('2d'); gKeep.clearRect(0,0,W,H);

  const { deleteLayers, preserveLayers } = pickMaskLayersForRow(row);

  for (const id of deleteLayers)  await drawOnlyLayerTo(gDel,  svg, id, W, H);
  for (const id of preserveLayers) await drawOnlyLayerTo(gKeep, svg, id, W, H);

  const eraseBitmap     = deleteLayers.length  ? await createImageBitmap(cDel)  : null;
  const preserveBitmap  = preserveLayers.length ? await createImageBitmap(cKeep) : null;

  return { eraseBitmap, preserveBitmap };
}

async function drawOnlyLayerTo(ctx, baseSvgNode, layerId, W, H){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = baseSvgNode.cloneNode(true);

  // Mantieni <style> e <defs> attivi (servono per .st0 ecc.)
  svg.querySelectorAll('*').forEach(el => {
    const tag = (el.tagName || '').toLowerCase();
    if (tag === 'style' || tag === 'defs') return;
    el.style.setProperty('display','none','important');
  });

  // Mostra solo il layer target & discendenti
  const esc = (window.CSS && CSS.escape) ? CSS.escape(layerId) : layerId.replace(/[^a-zA-Z0-9_-]/g,'\\$&');
  const target = svg.querySelector('#'+esc);
  if (target) {
    target.style.setProperty('display','', 'important');
    target.querySelectorAll('*').forEach(ch => ch.style.setProperty('display','', 'important'));

    // Hardening: fill pieno, niente stroke/opacity (qualunque colore va bene)
    const forceFill = (el) => {
      el.setAttribute('fill', '#000');
      if (el.hasAttribute('stroke'))  el.removeAttribute('stroke');
      if (el.hasAttribute('opacity')) el.removeAttribute('opacity');
      if (el.style?.setProperty) el.style.setProperty('fill', '#000', 'important');
    };
    forceFill(target);
    target.querySelectorAll('*').forEach(forceFill);
  }

  // Rasterizza
  const ser = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([ser], {type:'image/svg+xml'});
  const url  = URL.createObjectURL(blob);
  await new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>{ ctx.drawImage(i,0,0,W,H); URL.revokeObjectURL(url); res(); };
    i.onerror=rej; i.src=url;
  });
}

function resolveHoleMaskConf(cfg) {

  if (cfg.holeMaskRef && HOLE_MASKS_BASE[cfg.holeMaskRef]) return HOLE_MASKS_BASE[cfg.holeMaskRef]; // ref

// NUOVO FORMATO SOLO: conf = { svgPath, stopOnFirst?, rules:{ face:[...], body:[...], hair:[...], ... } }
function pickHoleMasksForRow(row, conf){
  if (!conf || !conf.rules || Array.isArray(conf.rules)) {
    return { svgPath: conf?.svgPath || null, layerIds: [] };
  }

  const layerIds = [];
  const stopOnFirst = !!conf.stopOnFirst;

  for (const [traitKey, rules] of Object.entries(conf.rules)) {
    if (!Array.isArray(rules)) continue;

    for (const rule of rules) {
      const needles = (rule.needles || []).map(String);
      const hit = needles.some(n => rowHasTrait(row, traitKey, n)); // <- STRICT per trait
      if (hit && rule.layer) {
        layerIds.push(rule.layer);
        if (stopOnFirst) return { svgPath: conf.svgPath, layerIds };
      }
    }
  }

  return { svgPath: conf.svgPath, layerIds };
}

  function splitStops(spec){
    if(!spec) return [];
    return String(spec).trim().replace(/##/g,'#').replace(/\s*\|\s*/g,'|').split('|').filter(Boolean);
  }
  function upsertLinearGradient(s, id, colors, angleDeg){
    const defs = ensureDefs(s);
    let g = s.querySelector('#'+id);
    if(!g || g.tagName !== 'linearGradient'){
      if(g) g.remove();
      g = document.createElementNS(NS,'linearGradient');
      g.setAttribute('id', id);

/* ===== OOPS: match tratti SOLO nei value di attributes ===== */
function rowHasAnyNeedle(row, needles){
  if(!row || !Array.isArray(needles) || needles.length===0) return false;

  const keys = needles
    .map(n => (n??'').toString().trim().toLowerCase())
    .filter(Boolean);

  const vals = Array.isArray(row.attributes)
    ? row.attributes
        .map(a => a && a.value)
        .filter(v => typeof v === 'string')
        .map(v => v.toLowerCase())
    : [];

  if(vals.length === 0){
    vals.push(
      ...Object.values(row)
        .filter(v => typeof v === 'string')
        .map(v => v.toLowerCase())
    );
  }

  return keys.some(k => vals.some(v => v.includes(k)));
}

// Match parziale su un trait specifico: es. rowHasTrait(row,'body','hoodie')
function rowHasTrait(row, traitKey, needle){
  if(!row || !needle) return false;
  const key = String(traitKey||'').trim().toLowerCase();
  const ndl = String(needle||'').trim().toLowerCase();

  // formato { attributes: [ {trait_type:'Body', value:'Green Hoodie'}, ... ] }
  if (Array.isArray(row.attributes)){
    for (const a of row.attributes){
      const t = (a?.trait_type || a?.traitType || a?.type || '').toString().toLowerCase();
      const v = (a?.value || '').toString().toLowerCase();
      if (!t || !v) continue;
      if (t.includes(key) && v.includes(ndl)) return true; // ⬅️ match PARZIALE
    }
  }

  // fallback: se la tua META flattava i campi (es. row.Body = 'Green Hoodie')
  for (const [k,v] of Object.entries(row)){
    if (typeof v !== 'string') continue;
    if (k.toLowerCase().includes(key) && v.toLowerCase().includes(ndl)) return true;
  }
  return false;
}


function getViewportHeight() {
  // Usa l’altezza della viewport “visibile” se disponibile (iOS Safari)
  const vv = window.visualViewport?.height;
  // Fallback stabile (evita oscillazioni di innerHeight su mobile)
  return Math.floor(vv || document.documentElement.clientHeight || window.innerHeight);
}

// Evita ricalcoli aggressivi quando c’è la tastiera aperta
function isSoftKeyboardOpen() {
  const ae = document.activeElement;
  const isTextField = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  // Heuristica: viewport molto bassa + campo attivo ⇒ tastiera
  return isTextField && getViewportHeight() < 520;
}

function updateFrameMaxHeight() {
  // ➜ Telefoni: nessun ridimensionamento JS
  if (IS_NARROW_TOUCH_PHONE) {
    applyMobileNaturalMode();
    return;
  }
  const frame    = document.querySelector('.frame');
  const img      = document.getElementById('composite');
  const shareRow = document.getElementById('shareRow');
  const footer   = document.getElementById('madeBy');
  if (!frame || !img) return;

  // Se la tastiera è aperta, non “strizzare” tutto
  if (isSoftKeyboardOpen()) return;

  // Posizione del frame rispetto al viewport
  const top = frame.getBoundingClientRect().top;

  // Queste righe tengono spazio anche quando visibility:hidden (coerente col tuo layout)
  const shareH = shareRow ? (shareRow.offsetHeight + 16) : 0;
  const footH  = (footer && getComputedStyle(footer).display !== 'none') ? (footer.offsetHeight + 12) : 0;

  const margin = 16;

  // 🔑 Usa visualViewport / clientHeight per il mobile
  const viewportH = getViewportHeight();
  const availableH = Math.max(240, viewportH - top - shareH - footH - margin);

  // Aggiorna la variabile CSS usata dall’immagine
  document.documentElement.style.setProperty('--frame-max-h', availableH + 'px');

  // Larghezza “target” basata sul rapporto dell’immagine (se noto)
  const ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 1;
  const parentW = frame.parentElement ? frame.parentElement.clientWidth : document.documentElement.clientWidth;

  // Non superare il contenitore, ma mantieni proporzioni
  const targetW = Math.min(parentW, Math.floor(availableH * ratio));

  frame.style.width    = targetW + 'px';
  frame.style.maxWidth = targetW + 'px';
}

    const row = META[id] || {};

    // --- OPTIONAL: scontorna il Doodle se la card lo chiede ---
    if (currentCfg?.useKnockout) {
	  try {
			const koMod = await import('./scripts/knockout.js?v=overlayMask2'); // <-- cambia versione per bust-cache
			const imgBitmap = await createImageBitmap(baseBlob);

			// costruisci erase/preserve da Overlay_mask.svg
			let eraseBitmap = null, preserveBitmap = null;
			const r = await buildErasePreserveBitmaps(imgBitmap.width, imgBitmap.height, row);
			eraseBitmap    = r.eraseBitmap;
			preserveBitmap = r.preserveBitmap;

			const KO_OPTS = {
			  ink: 64,
			  gap: -1,
			  edge: 26,
			  edge_dilate: 0,
			  edge_pad: 20,
			  seam: 1,
			  keep_radius: 8,
			  peel_iters: 8,
			  min_island_area: 250,
			  feather: 1,
			  erase_mask: eraseBitmap,
			  erase_keep_ink: true,
			  preserve_mask: preserveBitmap
			};


						const { fullCanvas } = await koMod.knockoutProcess(imgBitmap, KO_OPTS);
						baseBlob = await new Promise(res => fullCanvas.toBlob(res, 'image/png'));

				  } catch (e) {
					console.warn('Knockout failed or unavailable, using original base image.', e);
				  }
				}


    // (ora row ESISTE già)
    const nameSkin   = (row.Skin_colors   || row.skin_colors   || row.Skin   || '').trim();
    const nameSleeve = (row.Sleeve_colors || row.sleeve_colors || row.Sleeve || '').trim();
    const hexSkin    = NAME_TO_HEX[nameSkin];
    const hexSleeve  = NAME_TO_HEX[nameSleeve];


	
	// **INIZIO INSERIMENTO 3 – scelta variante**
	let variant = null; // default-only
	const declared = Array.isArray(currentCfg?.variants) ? currentCfg.variants.map(v=>String(v).toLowerCase()) : [];
	// priorità: puffer > fleece
	if (declared.includes('puffer') && rowHasAnyNeedle(row, ['puffer'])) {
	  variant = 'puffer';
	} else if (declared.includes('fleece') && rowHasAnyNeedle(row, ['fleece'])) {
	  variant = 'fleece';
	}
	// **FINE INSERIMENTO 3 – scelta variante**


    // ----- BEGIN: choose layout + call compose (patched) -----
	const layoutId   = pickLayoutId(currentCfg, row);
	const sleeveSpec = currentCfg.noRecolor ? null : hexSleeve;
	const skinSpec   = currentCfg.noRecolor ? null : hexSkin;
	console.log('[compose-call]', {
	  cfgId: currentCfg?.id,
	  body: (getTraitValue(row,'body')||'').toString(),  // <- body
	  sleeveSpec, skinSpec, variant, layoutId
	});


	const dataUrl = await composeDataUrl(baseBlob, currentCfg, sleeveSpec, skinSpec, variant, layoutId, row);
	// ----- END: choose layout + call compose (patched) -----

    imgEl.src = dataUrl;
    hideCenterPop();

    setShareVisible(true);
    imgEl.classList.remove('is-example');
    if(exBadge) exBadge.style.display = 'none';
    updateFrameMaxHeight(); // <-- garantisce che immagine + Copy PNG stiano a vista
    imgEl.alt = `Doodle ${id} + ${currentCfg.name||currentCfg.id}`;
    setStatus(`Dood ${id}: cooked and ready!`);

    const traits = Array.isArray(currentCfg.oopsTraits) ? currentCfg.oopsTraits : [];
    const message = (currentCfg.oopsMessage || '').trim();
    const showOops = (traits.length > 0) && message && rowHasAnyNeedle(row, traits);
    const oopsEl = document.getElementById('oopsBadge');
    if (oopsEl){
      if (showOops){
        oopsEl.textContent = message;
        oopsEl.style.display = 'inline-block';
      }else{
        oopsEl.style.display = 'none';
      }
    }

  }catch(e){
    if(location.protocol==='file:') setStatus('Please run a local server (e.g. python -m http.server 5500).');
    else setStatus('❌ ' + (e?.message || 'Something went wrong'));
    showCenterPop('Error', (e?.message || 'Something went wrong'), 2000);
    const oopsEl = document.getElementById('oopsBadge');
    if (oopsEl) oopsEl.style.display = 'none';
    setShareVisible(false);
  }
}

function applyBadge(badgeEl, cfg){
  if(!badgeEl) return;
  if(!cfg || !cfg.badge){
    badgeEl.style.display = 'none';
    return;
  }
  badgeEl.textContent = cfg.badge;
  badgeEl.style.display = 'inline-block';

  if(cfg.badgeColor) badgeEl.style.background = cfg.badgeColor;

  if(cfg.badgeText){
    badgeEl.style.color = cfg.badgeText;
    return;
  }

  try{
    const bg = getComputedStyle(badgeEl).backgroundColor;
    const m = bg && bg.match(/\d+(\.\d+)?/g);
    if(m){
      const [r,g,b] = m.map(Number);
      const yiq = (r*299 + g*587 + b*114) / 1000;
      badgeEl.style.color = yiq >= 150 ? '#000' : '#fff';
    }else{
      badgeEl.style.color = '#000';
    }
  }catch{
    badgeEl.style.color = '#000';
  }
}

// ===== Fix tastiera iPad in PWA =====
(function fixIOSPWAKeyboard(){
  const inPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isiPad = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
  if(!(inPWA && isiPad)) return;

  if(!tokenEl) return;
  tokenEl.setAttribute('readonly', 'readonly');

  tokenEl.addEventListener('touchend', function onTouch(){
    tokenEl.removeAttribute('readonly');
    setTimeout(()=>{
      tokenEl.focus();
      const v = tokenEl.value; tokenEl.value=''; tokenEl.value=v;
    }, 0);
    tokenEl.removeEventListener('touchend', onTouch);
  }, {passive:true});

  tokenEl.addEventListener('pointerdown', function onPD(){
    if (tokenEl.hasAttribute('readonly')) {
      tokenEl.removeAttribute('readonly');
      setTimeout(()=>tokenEl.focus(), 0);
    }
  }, {passive:true});
})();

function dataUrlToBlob(dataURL){
  const [head, body] = dataURL.split(',');
  const mime = (/data:(.*?);/.exec(head) || [,'application/octet-stream'])[1];
  const bstr = head.includes(';base64') ? atob(body) : decodeURIComponent(body);
  const buf = new Uint8Array(bstr.length);
  for (let i=0;i<bstr.length;i++) buf[i] = bstr.charCodeAt(i);
  return new Blob([buf], {type:mime});
}

async function shareMobileX(){
  if (!MOBILE_SHARE) return;

  const id = parseInt((tokenEl?.value || '').trim(), 10);
  if (!Number.isFinite(id)) return;

  const layoutName = (currentCfg?.name || currentCfg?.id || 'Overlay') + '';
  const caption = `Cooked "${layoutName}" on Doods #${id} !

Get yours at https://arb8i.xyz !`;

  try{
    const img = document.getElementById('composite');
    const src = img?.src;
    if (!src || !navigator.share) return;

    const blob = src.startsWith('data:') ? dataUrlToBlob(src) : await (await fetch(src)).blob();
    const file = new File([blob], 'doodle.png', { type: 'image/png' });

    try { await navigator.clipboard.writeText(caption); } catch {}
    await navigator.share({ text: caption, files: [file] });
    
  }catch(e){
    console.error('Share failed:', e);
  }
}

async function copyImage(){
  try{
    if (imgEl.classList.contains('is-example')) {
      setStatus('Generate an image first.');
      return;
    }

    const src = imgEl?.src;
    if (!src) return;

    let blob = src.startsWith('data:')
      ? dataUrlToBlob(src)
      : await (await fetch(src)).blob();

    if (blob.type !== 'image/png') {
      const tmp = new Image();
      await new Promise((res, rej)=>{ tmp.onload=()=>res(); tmp.onerror=rej; tmp.src=src; });
      const c = document.createElement('canvas');
      c.width = tmp.naturalWidth; c.height = tmp.naturalHeight;
      c.getContext('2d').drawImage(tmp, 0, 0);
      blob = await new Promise(res => c.toBlob(res, 'image/png'));
    }

    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
      showCenterPop('Copied!', 'Image copied to clipboard ✅', 1600);
    } else {
      const a = document.createElement('a');
      a.href = src;
      a.download = 'doodle.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setStatus('Clipboard not supported here. Download started.');
      showCenterPop('Downloaded', 'PNG saved to your device', 1600);

    }
  } catch (e){
    console.error(e);
    setStatus('Copy failed. Long-press / save might work.');
    
  }
}

/* ===== Popup centrale helpers ===== */
function showCenterPop(title, desc = '', autoHideMs = 0){
  const el = document.getElementById('centerPop');
  const t  = document.getElementById('cpTitle');
  const d  = document.getElementById('cpDesc');
  if(!el || !t || !d) return;

  t.textContent = title || '';
  d.textContent = desc  || '';
  d.style.display = desc ? '' : 'none';

  el.style.display = 'flex';

  if (autoHideMs > 0){
    clearTimeout(showCenterPop._t);
    showCenterPop._t = setTimeout(hideCenterPop, autoHideMs);
  }
}
function hideCenterPop(){
  const el = document.getElementById('centerPop');
  if (el) el.style.display = 'none';
}
